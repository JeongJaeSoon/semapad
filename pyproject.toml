[project]
name = "semapad"
version = "0.1.19"
description = "Colour-signal pad and dashboard for Claude Desktop conversations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
semapad = "semapad.cli:main"

[project.urls]
Repository = "https://github.com/JeongJaeSoon/semapad"
Issues = "https://github.com/JeongJaeSoon/semapad/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a real Codex Micro"]
